<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産運用シミュレーション</title>
    <!-- Chart.jsの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* スクショのiOSダークUIに合わせた配色（チャコールグレー × 白文字） */
        :root {
            --bg: #141414;
            --surface: #1b1b1b;
            --surface-2: #232323;
            --line: #2e2e2e;
            --text: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.35);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 28px 24px;
            border-radius: 28px;
            border: 1px solid var(--line);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin: 0 0 28px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 22px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        label span {
            font-variant-numeric: tabular-nums;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            cursor: pointer;
            margin: 0;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }
        input[type="range"]::-moz-range-track {
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            margin-top: -9px;
            border-radius: 50%;
            background: var(--text);
            border: none;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text);
            border: none;
        }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin: 32px 0;
            padding: 22px 16px;
            background: var(--surface-2);
            border-radius: 18px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .summary-value {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
        /* 免責事項のスタイル（小さめ・グレーの文字） */
        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-faint);
            text-align: justify;
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>資産運用シミュレーション</h1>

    <div class="control-group">
        <label>初期投資額: <span id="val-initial">1,000,000 円</span></label>
        <input type="range" id="initial" min="0" max="18000000" step="100000" value="1000000">
    </div>

    <div class="control-group">
        <label>毎月の追加積立: <span id="val-monthly">50,000 円</span></label>
        <input type="range" id="monthly" min="0" max="150000" step="5000" value="50000">
    </div>

    <div class="control-group">
        <label>想定年利: <span id="val-rate">7.0 %</span></label>
        <input type="range" id="rate" min="1" max="15" step="0.5" value="7">
    </div>

    <div class="control-group">
        <label>運用期間: <span id="val-years">20 年</span></label>
        <input type="range" id="years" min="1" max="30" step="1" value="20">
    </div>

    <div class="summary-box">
        <div class="summary-item">
            <div class="summary-label">総投資元本</div>
            <div class="summary-value" id="res-principal">-</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">最終的な資産総額</div>
            <div class="summary-value" id="res-total">-</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">運用益（増えた分）</div>
            <div class="summary-value" id="res-profit">-</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="simulationChart"></canvas>
    </div>

    <!-- 免責事項のエリア -->
    <div class="disclaimer">
        ※このシミュレーションはあくまで机上の計算であり、将来の運用成果を保証するものではありません。投資の最終判断はご自身で行ってください。
    </div>
</div>

<script>
    const initialInput = document.getElementById('initial');
    const monthlyInput = document.getElementById('monthly');
    const rateInput = document.getElementById('rate');
    const yearsInput = document.getElementById('years');

    const valInitial = document.getElementById('val-initial');
    const valMonthly = document.getElementById('val-monthly');
    const valRate = document.getElementById('val-rate');
    const valYears = document.getElementById('val-years');

    const resPrincipal = document.getElementById('res-principal');
    const resTotal = document.getElementById('res-total');
    const resProfit = document.getElementById('res-profit');

    const ctx = document.getElementById('simulationChart').getContext('2d');

    // グラフの文字色・フォントをダークテーマに合わせる
    Chart.defaults.color = 'rgba(255, 255, 255, 0.55)';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.08)';
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    let simulationChart;

    function formatCurrency(num) {
        return Math.round(num).toLocaleString() + ' 円';
    }

    function updateSimulation() {
        const initial = parseFloat(initialInput.value);
        const monthly = parseFloat(monthlyInput.value);
        const rate = parseFloat(rateInput.value) / 100;
        const maxYears = parseInt(yearsInput.value);

        valInitial.innerText = formatCurrency(initial);
        valMonthly.innerText = formatCurrency(monthly);
        valRate.innerText = (rate * 100).toFixed(1) + ' %';
        valYears.innerText = maxYears + ' 年';

        const labels = [];
        const totalData = [];
        const principalData = [];

        for (let t = 0; t <= maxYears; t++) {
            labels.push(t === 0 ? '開始' : t + '年後');

            const principal = initial + (monthly * 12 * t);
            principalData.push(principal);

            let total = 0;
            if (rate > 0) {
                const monthlyRate = rate / 12;
                const months = t * 12;
                total = initial * Math.pow(1 + monthlyRate, months) + monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
            } else {
                total = principal;
            }
            totalData.push(Math.round(total));
        }

        const finalPrincipal = principalData[principalData.length - 1];
        const finalTotal = totalData[totalData.length - 1];
        const finalProfit = finalTotal - finalPrincipal;

        resPrincipal.innerText = formatCurrency(finalPrincipal);
        resTotal.innerText = formatCurrency(finalTotal);
        resProfit.innerText = '+' + formatCurrency(finalProfit);

        if (simulationChart) {
            simulationChart.data.labels = labels;
            simulationChart.data.datasets[0].data = totalData;
            simulationChart.data.datasets[1].data = principalData;
            simulationChart.update();
        } else {
            simulationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '資産総額',
                            data: totalData,
                            borderColor: '#ffffff',
                            backgroundColor: 'rgba(255, 255, 255, 0.08)',
                            pointRadius: 0,
                            fill: true,
                            tension: 0.2
                        },
                        {
                            label: '投資元本',
                            data: principalData,
                            borderColor: 'rgba(255, 255, 255, 0.4)',
                            pointRadius: 0,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            ticks: {
                                callback: function(value) {
                                    return (value / 10000) + '万円';
                                }
                            }
                        }
                    }
                }
            });
        }
    }

    [initialInput, monthlyInput, rateInput, yearsInput].forEach(input => {
        input.addEventListener('input', updateSimulation);
    });

    updateSimulation();
</script>

</body>
</html>
